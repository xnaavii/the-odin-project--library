<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <button class="new-book--btn btn" type="button">New Book</button>
      <div class="library"></div>
    </div>
    <dialog class="new-book--modal">
      <div>
        <h2>Add new book</h2>
        <button
          type="button"
          class="cancel-add-new-book--btn btn btn-secondary"
        >
          Cancel
        </button>
      </div>
      <form class="new-book--form">
        <div class="input-group">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            placeholder="e.g. Very Nice Book"
          />
        </div>

        <div class="input-group">
          <label for="author">Author</label>
          <input
            type="text"
            id="author"
            name="author"
            placeholder="John Smith"
          />
        </div>

        <div class="input-group">
          <label for="pages">Pages</label>
          <input type="text" id="pages" name="pages" placeholder="200" />
        </div>

        <button type="submit" class="add-new-book--btn btn">
          Add new book
        </button>
      </form>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
